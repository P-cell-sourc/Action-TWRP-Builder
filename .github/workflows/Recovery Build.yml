name: Recovery Build

# ──────────────────────────────────────────────────────────────────────
# 运行环境：Ubuntu 22.04（Jammy）
#   AOSP 14 / TWRP 14.1 官方支持矩阵是 20.04 / 22.04。24.04（Noble）虽然也能跑，
#   但会带来一批额外噪音：libncurses5 被移除、python 3.12 与部分 soong 脚本不兼容、
#   linux-modules-extra 版本对不上导致 apt 直接失败。换成 22.04 后这些都不存在。
#
# 软件源：清华 TUNA 镜像（apt）。repo 工具也优先从 TUNA 下载，
#   官方 storage.googleapis.com 在国内经常超时。
# ──────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL（用 SSH 就填 git@github.com:XXX）'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/P-cell-sourc/device_vivo_PD2551_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'twrp16'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/vivo/PD2551'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL（没有 common tree 就留空）'
        required: false
        default: ''
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH（留空则跟随 DEVICE_TREE_BRANCH）'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH（没有 common tree 就留空）'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME（必须与 lunch 出的 TARGET_PRODUCT 一致）'
        required: true
        default: 'PD2551'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_PD2551'
      BUILD_TARGET:
        description: 'BUILD_TARGET（recovery / boot / vendorboot，也接受 vendor_boot）'
        required: true
        default: 'vendorboot'
      JAVA_VERSION:
        description: 'JAVA_VERSION（twrp-14.x 用 17；11/12.1 用 11；Android 10 及更早用 8）'
        required: true
        default: '17'
      BUILD_JOBS:
        description: 'BUILD_JOBS（make -j，0 = 按内存自动：约每 4GB 1 个并发）'
        required: false
        default: '0'
      ENABLE_CCACHE:
        description: 'ENABLE_CCACHE（true = 启用 ccache + 缓存，重复构建快很多）'
        required: false
        default: 'true'

concurrency:
  group: recovery-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    # ──────────────────────────────────────────────────────────────
    # 0. 参数回显
    # ──────────────────────────────────────────────────────────────
    - name: Display Run Parameters
      run: |
        echo "::group::Run Parameters"
        echo "Runner                : ubuntu-22.04"
        echo "Manifest URL          : ${{ inputs.MANIFEST_URL }}"
        echo "Manifest Branch       : ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL       : ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch    : ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path           : ${{ inputs.DEVICE_PATH }}"
        echo "Common Tree URL       : ${{ inputs.COMMON_TREE_URL }}"
        echo "Common Path           : ${{ inputs.COMMON_PATH }}"
        echo "Device Name           : ${{ inputs.DEVICE_NAME }}"
        echo "Makefile Name         : ${{ inputs.MAKEFILE_NAME }}"
        echo "Build Target          : ${{ inputs.BUILD_TARGET }}.img"
        echo "Java Version          : ${{ inputs.JAVA_VERSION }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    # 释放 ~20GB：AOSP out/ 至少需要 30GB，标准 runner 只有 70GB 左右
    - name: Free disk space
      uses: rokibhasansagar/slimhub_actions@main

    # ──────────────────────────────────────────────────────────────
    # 1. 编译环境（清华源 + Ubuntu 22.04 依赖集）
    #    22.04 上 libncurses5 / libtinfo5 仍然存在，prebuilt clang 能直接跑；
    #    不需要 linux-modules-extra（那个包在 24.04 上根本没有对应版本）。
    # ──────────────────────────────────────────────────────────────
    - name: Prepare the environment (TUNA mirror)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -uo pipefail

        # ── 换成清华源 ──
        #   GitHub 托管 runner 默认用 azure.archive.ubuntu.com，国内拉取极慢。
        #   22.04 用 /etc/apt/sources.list，24.04 改成 deb822 的 ubuntu.sources，
        #   两个都处理一遍，镜像升级了也不会失效。
        echo "::group::switch to TUNA mirror"
        #   注意：分隔符必须避开 '|'，因为 -E 模式下该字符在正则里是“或”，
        #   sed 会把它当成分隔符截断表达式（unknown option to `s'）。
        #   这里用 '#' 作分隔符，URL 中不含 '#'，安全。
        #   加 '|| echo warning' 是为了：换源失败也不应该中断整次构建。
        TUNA_SED='s#https?://(archive|security|azure\.archive)\.ubuntu\.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g'
        if [ -f /etc/apt/sources.list ]; then
          sudo cp -f /etc/apt/sources.list /etc/apt/sources.list.bak
          sudo sed -i -E "$TUNA_SED" /etc/apt/sources.list \
            || echo "::warning::sources.list 换源失败，继续使用默认源"
        fi
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo cp -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak
          sudo sed -i -E "$TUNA_SED" /etc/apt/sources.list.d/ubuntu.sources \
            || echo "::warning::ubuntu.sources 换源失败，继续使用默认源"
        fi
        grep -rhoE "https?://[^ ]*ubuntu[^ ]*" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null | sort -u || true
        if ! sudo grep -rqs "mirrors.tuna.tsinghua.edu.cn" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null; then
          echo "::warning::未检测到清华源，下面打印当前生效的源（runner 换域名时据此调整正则）"
          sudo grep -rhsE "^(deb |URIs)" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null | head -10 || true
        fi
        echo "::endgroup::"

        APT_OPTS="-y -q -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o Acquire::Retries=5"

        echo "::group::apt update"
        if ! sudo -E apt-get update $APT_OPTS; then
          echo "::warning::apt update 未完全成功（第三方源 403/签名失效很常见），继续安装"
        fi
        echo "::endgroup::"

        # AOSP 14 在 Ubuntu 22.04 上真正需要的包
        REQUIRED="
          git git-lfs curl ca-certificates unzip zip rsync tree
          bc bison flex gperf ccache make build-essential
          gcc-multilib g++-multilib
          libc6-dev lib32ncurses-dev lib32readline-dev lib32z1-dev
          libncurses-dev libncurses5 libtinfo5
          libxml2-utils xsltproc libx11-dev x11proto-core-dev
          libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libgtk-3-dev libsdl1.2-dev
          imagemagick libbz2-dev zlib1g-dev libssl-dev lzma lzop lz4
          squashfs-tools schedtool pngcrush ncftp qemu-user-static
          device-tree-compiler python3 python3-protobuf
        "

        echo "::group::apt install (batch)"
        if ! sudo -E apt-get install $APT_OPTS --no-install-recommends $REQUIRED; then
          echo "::endgroup::"
          echo "::warning::批量安装失败，改为逐包安装以定位问题包"
          echo "::group::apt install (per package)"
          FAILED=""
          for p in $REQUIRED; do
            if sudo -E apt-get install $APT_OPTS --no-install-recommends "$p"; then
              echo "  [ok]   $p"
            else
              echo "  [FAIL] $p"
              FAILED="$FAILED $p"
            fi
          done
          echo "::endgroup::"
          [ -n "$FAILED" ] && echo "::warning::未能安装：$FAILED（不影响编译的可忽略）"
        else
          echo "::endgroup::"
        fi

        # 硬性校验：这几个缺了必然编不过，早失败比跑 40 分钟再失败划算
        echo "::group::verify toolchain"
        MISSING=""
        for p in git bc gperf make ccache build-essential libssl-dev zlib1g-dev; do
          dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"
        done
        if dpkg -s libncurses5 >/dev/null 2>&1 || dpkg -s libncurses6 >/dev/null 2>&1; then
          echo "ncurses: ok"
        else
          MISSING="$MISSING libncurses5"
        fi
        if [ -n "$MISSING" ]; then
          echo "::error::关键依赖缺失：$MISSING"
          exit 1
        fi
        lsb_release -ds 2>/dev/null || cat /etc/os-release | head -2
        gcc --version | head -1
        python3 --version
        free -h || true
        df -h / || true
        echo "::endgroup::"

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.JAVA_VERSION }}

    - name: Setup SSH Keys
      if: >-
        startsWith(inputs.MANIFEST_URL, 'git@github.com') ||
        startsWith(inputs.DEVICE_TREE_URL, 'git@github.com') ||
        startsWith(inputs.COMMON_TREE_URL, 'git@github.com')
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    # ──────────────────────────────────────────────────────────────
    # 2. repo 工具（清华镜像优先）
    # ──────────────────────────────────────────────────────────────
    - name: Install repo
      run: |
        set -euo pipefail
        mkdir -p "$HOME/bin"
        if ! curl -fsSL --retry 5 --retry-delay 3 \
              -o "$HOME/bin/repo" https://mirrors.tuna.tsinghua.edu.cn/git/git-repo; then
          echo "::warning::清华镜像失败，回落到官方地址"
          curl -fsSL --retry 5 --retry-delay 3 \
              -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
        fi
        chmod +x "$HOME/bin/repo"
        sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo
        echo "$HOME/bin" >> "$GITHUB_PATH"
        repo --version | head -2 || true

    # ──────────────────────────────────────────────────────────────
    # 3. 初始化 + 同步源码
    # ──────────────────────────────────────────────────────────────
    - name: Initialize repo
      id: pwd
      run: |
        set -euo pipefail
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$PWD" >> "$GITHUB_OUTPUT"
        git config --global user.name  "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        git config --global --add safe.directory '*'
        # repo 在非交互环境下别去问 tty
        export GIT_TERMINAL_PROMPT=0

        for attempt in 1 2 3; do
          if repo init --depth=1 --no-clone-bundle \
               -u "${{ inputs.MANIFEST_URL }}" \
               -b "${{ inputs.MANIFEST_BRANCH }}"; then
            break
          fi
          echo "::warning::repo init 第 $attempt 次失败，10s 后重试"
          if [ "$attempt" -eq 3 ]; then
            echo "::error::repo init 连续 3 次失败，请检查 MANIFEST_URL / MANIFEST_BRANCH"
            exit 1
          fi
          sleep 10
        done

    - name: Repo Sync
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        export GIT_TERMINAL_PROMPT=0
        for attempt in 1 2 3; do
          if repo sync -j"$(nproc --all)" -c --force-sync --no-clone-bundle --no-tags; then
            echo "repo sync 成功（第 $attempt 次尝试）"
            exit 0
          fi
          echo "::warning::repo sync 第 $attempt 次失败，30s 后重试"
          sleep 30
        done
        echo "::error::repo sync 连续 3 次失败"
        exit 1

    # ──────────────────────────────────────────────────────────────
    # 3.5 补回 external/guava
    #     ALLOW_MISSING_DEPENDENCIES=true 时缺模块不会在解析期报错，而是变成
    #     构建期必然失败的占位规则：
    #       module ...unsupportedappusage-annotation-processor-lib
    #         missing dependencies: guava
    #     guava 出自 external/guava，TWRP 的 remove-minimal.xml 会把它 remove 掉。
    # ──────────────────────────────────────────────────────────────
    - name: Ensure external/guava (host java dependency)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/ensure_guava.py" . \
          || echo "::warning::external/guava 自愈脚本执行失败"

    # ──────────────────────────────────────────────────────────────
    # 4. 设备树 / common 树
    # ──────────────────────────────────────────────────────────────
    - name: Clone device tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -euo pipefail
        D="${{ inputs.DEVICE_PATH }}"
        mkdir -p "$(dirname "$D")"
        rm -rf "$D"
        git clone --depth 1 -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
          "${{ inputs.DEVICE_TREE_URL }}" "$D"

        echo "===== 设备树顶层内容 ====="
        ls -la "$D" | head -40 || true

        if [ ! -f "$D/AndroidProducts.mk" ]; then
          echo "::error::分支 ${{ inputs.DEVICE_TREE_BRANCH }} 中没有 AndroidProducts.mk，请检查 DEVICE_TREE_BRANCH"
          exit 1
        fi
        if ! grep -q "${{ inputs.MAKEFILE_NAME }}" "$D/AndroidProducts.mk"; then
          echo "::error::AndroidProducts.mk 未注册产品 ${{ inputs.MAKEFILE_NAME }}"
          cat "$D/AndroidProducts.mk"
          exit 1
        fi

    - name: Clone common tree
      if: ${{ inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != '' }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -euo pipefail
        C="${{ inputs.COMMON_PATH }}"
        BRANCH="${{ inputs.COMMON_TREE_BRANCH }}"
        [ -n "$BRANCH" ] || BRANCH="${{ inputs.DEVICE_TREE_BRANCH }}"
        mkdir -p "$(dirname "$C")"
        rm -rf "$C"
        git clone --depth 1 -b "$BRANCH" "${{ inputs.COMMON_TREE_URL }}" "$C"

    # ──────────────────────────────────────────────────────────────
    # 4.5 修设备树（twrpdtgen 模板常见问题）
    # ──────────────────────────────────────────────────────────────
    - name: Patch device tree
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        TREES="${{ inputs.DEVICE_PATH }} ${{ inputs.COMMON_PATH }}"
        PREFIX='$(SRC_TARGET_DIR)/'

        for D in $TREES; do
          [ -d "$D" ] || { echo "::warning::目录不存在，跳过：$D"; continue; }

          # (1) target/product/embedded.mk 在 Android 9 之后被删除，等价的最小配置是 base.mk
          for f in $(grep -rl "product/embedded\.mk" "$D" --include="*.mk" 2>/dev/null); do
            sed -i -E 's@\$\(SRC_TARGET_DIR\)/product/embedded\.mk@$(SRC_TARGET_DIR)/product/base.mk@g' "$f"
            sed -i -E 's@build/make/target/product/embedded\.mk@$(SRC_TARGET_DIR)/product/base.mk@g' "$f"
            echo "已把 $f 的 embedded.mk 替换为 base.mk"
          done

          # (2) Android 14+ 已废弃 PRODUCT_STATIC_BOOT_CONTROL_HAL
          for f in $(grep -rl "PRODUCT_STATIC_BOOT_CONTROL_HAL" "$D" --include="*.mk" 2>/dev/null); do
            sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/,+4d' "$f"
            echo "已从 $f 移除过时的 PRODUCT_STATIC_BOOT_CONTROL_HAL"
          done
        done

        # (3) 可选分区的输出路径
        #     board_config.mk 的 check_image_config：声明了 BOARD_<P>IMAGE_FILE_SYSTEM_TYPE
        #     就必须设 TARGET_COPY_OUT_<P> := <P>，否则 lunch 直接 $(error)。
        python3 "$GITHUB_WORKSPACE/scripts/fix_copy_out.py" \
          "${{ inputs.DEVICE_PATH }}" "${{ inputs.COMMON_PATH }}" \
          || echo "::warning::COPY_OUT 自动修复未完成，继续尝试编译"

        # (4) chained vbmeta 分区的四个签名变量
        #     soong fsgen 要求 KEY_PATH，make 的 add-vbmeta-image 还额外要求
        #     ALGORITHM / ROLLBACK_INDEX / ROLLBACK_INDEX_LOCATION，缺一个就 $(error)。
        python3 "$GITHUB_WORKSPACE/scripts/fix_device_avb.py" $TREES \
          || echo "::warning::chained AVB 变量自动补全未完成，继续尝试编译"

        # (5) vendor_boot：变量名纠错 + AVB 四项
        #     AOSP 判断是否构建 vendor_boot.img 用的是 BOARD_USES_VENDOR_BOOTIMAGE，
        #     写成 BOARD_USES_VENDOR_BOOT 时 ifeq 不成立，vendorbootimage 会变成
        #     「没有依赖也没有配方」的空目标——make 打印 Nothing to be done 并
        #     exit 0，产物目录里自然一个 vendor_boot.img 都没有。
        python3 "$GITHUB_WORKSPACE/scripts/fix_device_vendor_boot.py" . "${{ inputs.DEVICE_PATH }}" \
          || echo "::warning::vendor_boot 配置修补未完成，继续尝试编译"

        # (6) 预检：设备树继承的 $(SRC_TARGET_DIR)/product/*.mk 是否真的存在
        MISSING=""
        REFS=0
        for ref in $(grep -rhoE '\$\(SRC_TARGET_DIR\)/product/[A-Za-z0-9_.-]+' $TREES --include="*.mk" 2>/dev/null | sort -u); do
          REFS=$((REFS + 1))
          rel=${ref#"$PREFIX"}
          if [ ! -f "build/make/target/$rel" ] && [ ! -f "build/target/$rel" ]; then
            MISSING="$MISSING $rel"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "::warning::设备树继承了源码中不存在的产品配置：$MISSING（lunch/make 很可能失败）"
        elif [ "$REFS" -eq 0 ]; then
          echo "设备树未引用 SRC_TARGET_DIR 下的产品配置，跳过继承预检"
        else
          echo "继承预检通过：$REFS 个引用全部存在"
        fi

    # ──────────────────────────────────────────────────────────────
    # 5. 依赖转换 + 二次同步
    # ──────────────────────────────────────────────────────────────
    - name: Check Build Tree
      id: buildtree
      run: |
        if [ "${{ startsWith(inputs.MANIFEST_BRANCH, 'twrp') }}" = "true" ]; then
          echo "value=twrp" >> "$GITHUB_OUTPUT"
        else
          echo "value=omni" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync Device Dependencies
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        DEP="${{ steps.buildtree.outputs.value }}.dependencies"
        FOUND=0
        for d in "${{ inputs.DEVICE_PATH }}/$DEP" "${{ inputs.COMMON_PATH }}/$DEP"; do
          [ -n "$d" ] || continue
          if [ -f "$d" ]; then
            echo "===== 解析依赖文件：$d ====="
            bash "$GITHUB_WORKSPACE/scripts/convert.sh" "$d" || echo "::warning::convert.sh 处理 $d 失败"
            FOUND=1
          fi
        done
        if [ "$FOUND" = "0" ]; then
          echo "::notice::未找到 $DEP，跳过依赖同步"
          exit 0
        fi
        echo "===== 生成的 local_manifest ====="
        cat .repo/local_manifests/roomservice.xml || true
        repo sync -j"$(nproc --all)" -c --force-sync --no-clone-bundle --no-tags || true

    # ──────────────────────────────────────────────────────────────
    # 5.5 swap：16GB runner 靠 swap 把 RAM+swap 补到 28GB 左右
    # ──────────────────────────────────────────────────────────────
    - name: Set up swap
      continue-on-error: true
      run: |
        set -uo pipefail
        MEM_GB=$(awk '/MemTotal/{printf "%d", $2/1024/1024}' /proc/meminfo)
        FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        echo "内存 ${MEM_GB}GB / 根分区可用 ${FREE_GB}GB"
        WANT=12
        MAX=$(( FREE_GB - 16 ))
        SIZE=$(( WANT < MAX ? WANT : MAX ))
        if [ "$SIZE" -lt 2 ]; then
          echo "::warning::可用磁盘 ${FREE_GB}GB 偏小（out/ 至少要留 16GB），跳过 swap"
          exit 0
        fi
        [ "$SIZE" -lt "$WANT" ] && echo "::notice::磁盘偏紧，swap 降为 ${SIZE}GB"
        echo "创建 ${SIZE}GB swap"
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile
        if ! sudo fallocate -l "${SIZE}G" /swapfile 2>/dev/null; then
          sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SIZE * 1024)) status=none
        fi
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile >/dev/null
        sudo swapon /swapfile
        sudo sysctl -w vm.swappiness=60 >/dev/null 2>&1 || true
        free -h
        df -h /

    # ──────────────────────────────────────────────────────────────
    # 5.6 ccache：不改产物，只让第二次构建快 3~5 倍
    # ──────────────────────────────────────────────────────────────
    - name: Restore ccache
      if: ${{ inputs.ENABLE_CCACHE == 'true' }}
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-

    - name: Configure ccache
      if: ${{ inputs.ENABLE_CCACHE == 'true' }}
      run: |
        set -uo pipefail
        mkdir -p "$HOME/.ccache"
        ccache -M 4G >/dev/null 2>&1 || true
        ccache -z >/dev/null 2>&1 || true
        {
          echo "USE_CCACHE=1"
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_COMPRESS=1"
          echo "CCACHE_COMPILERCHECK=content"
        } >> "$GITHUB_ENV"
        ccache -s || true

    # ──────────────────────────────────────────────────────────────
    # 5.7 soong_build 内存上限透传
    #     build/soong/ui/build/soong.go 用 `env -i` 启动 soong_build，
    #     shell 里 export 的 GOMEMLIMIT/GOGC 传不进去，解析阶段堆涨到被 OOM。
    # ──────────────────────────────────────────────────────────────
    - name: Patch soong_build memory limit propagation
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/patch_soong_memlimit.py" . \
          || echo "::warning::未能打上 GOMEMLIMIT 透传补丁"

    # ──────────────────────────────────────────────────────────────
    # 5.8 去掉已废弃的 -ndk_platform 后缀
    #     AOSP 已删除 *-ndk_platform.so，但 bootable/recovery 的
    #     TW_INCLUDE_CRYPTO_FBE 分支还在用旧名字，链接时报
    #     "missing and no known rule to make it"。
    # ──────────────────────────────────────────────────────────────
    - name: Patch recovery makefiles (removed ndk_platform AIDL backend)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/fix_ndk_platform.py" . \
          || echo "::warning::-ndk_platform 后缀修补未完成，libtar 链接可能再次失败"

    # ──────────────────────────────────────────────────────────────
    # 5.9 libtar 的 fscrypt 兼容层
    #     TWRP 14.1 两个仓库不同步：vold 改成了 fscrypt_policy_v1/v2 两套接口，
    #     删掉了 union fscrypt_policy 和 get_policy 等 helper，libtar 还在用旧的。
    #     再叠加 bionic 的 #define fscrypt_policy fscrypt_policy_v1，
    #     C 下直接报 "must use 'struct' tag to refer to type ..."。
    # ──────────────────────────────────────────────────────────────
    - name: Patch libtar fscrypt API (TWRP 14.1 vold mismatch)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/fix_libtar_fscrypt.py" . \
          || echo "::warning::libtar fscrypt 兼容层未写入，编译可能再次失败"

    # ──────────────────────────────────────────────────────────────
    # 5.10 libtar 链接依赖
    #      libtar 用 LOCAL_STATIC_LIBRARIES += libvold 复用 vold 的实现，
    #      但 AOSP 14 的 vold 多了三个依赖（libboot_control_client /
    #      libsysutils / libasync_safe），libtar 的 Android.mk 还停在 12。
    # ──────────────────────────────────────────────────────────────
    - name: Patch libtar link libraries (vold 14 deps)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/fix_libtar_link.py" . \
          || echo "::warning::libtar 链接依赖未补齐，链接可能再次失败"

    # ──────────────────────────────────────────────────────────────
    # 5.11 recovery 的 FDE（全盘加密）API
    #      partition.cpp / partitionmanager.cpp 在 #ifdef TW_INCLUDE_CRYPTO 里
    #      调用 set_partition_data / cryptfs_check_footer /
    #      cryptfs_get_password_type / delete_crypto_blk_dev /
    #      cryptfs_check_passwd，而 vold 的 android-14.1 分支已经把它们删了
    #      （cryptfs.h 只剩 cryptfs_setup_ext_volume / cryptfs_get_keygen）。
    #      编译到 86% 会报一串 use of undeclared identifier。
    #      AOSP 13 起只有 FBE，这些 FDE 调用永远不会被走到，补占位即可。
    # ──────────────────────────────────────────────────────────────
    - name: Patch recovery FDE API (vold 14 dropped cryptfs FDE)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/fix_recovery_cryptfs.py" . \
          || echo "::warning::recovery FDE 兼容层未写入，partition.cpp 可能编译失败"

    # ──────────────────────────────────────────────────────────────
    # 5.12 recovery 可执行文件的链接依赖
    #      recovery 也静态链了 libvold（LOCAL_STATIC_LIBRARIES += libvold），
    #      AOSP 14 的 VolumeManager.cpp 调用 NetlinkEvent::dump() /
    #      findParam()，这两个符号由 libsysutils 提供，但 recovery 的
    #      LOCAL_SHARED_LIBRARIES 里没有它 → 96% 链接 recovery 时 undef。
    # ──────────────────────────────────────────────────────────────
    - name: Patch recovery link libraries (libsysutils)
      continue-on-error: true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/fix_recovery_link.py" . \
          || echo "::warning::recovery 链接依赖未补齐，recovery 可能链接失败"

    # ──────────────────────────────────────────────────────────────
    # 6. 编译
    # ──────────────────────────────────────────────────────────────
    - name: Building recovery
      id: build
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        # 不能用 set -u：build/envsetup.sh 会引用未定义变量（如 $TOP）
        set -o pipefail
        set +u
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TZ=UTC

        MK="${{ inputs.MAKEFILE_NAME }}"
        TARGET="${{ inputs.BUILD_TARGET }}"

        # make 目标名与产物名不同：vendorbootimage -> vendor_boot.img
        case "$TARGET" in
          vendorboot|vendor_boot|vendor-boot) MAKE_TARGET="vendorbootimage" ;;
          boot)                               MAKE_TARGET="bootimage" ;;
          recovery)                           MAKE_TARGET="recoveryimage" ;;
          *)                                  MAKE_TARGET="${TARGET}image" ;;
        esac
        echo "make 目标：$MAKE_TARGET"

        # Android 13+ 的 lunch 是三段式：<product>-<release>-<variant>
        RELS=""
        if [ -d build/release/release_configs ]; then
          RELS=$(ls build/release/release_configs 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)
        fi
        echo "源码可用 release 配置：$(echo $RELS)"

        LUNCH_OK=""
        LUNCH_ERR="$(mktemp)"
        try_lunch() {
          lunch "$1" >"$LUNCH_ERR" 2>&1 || return 1
          [ -n "$(get_build_var TARGET_PRODUCT 2>/dev/null)" ]
        }

        if try_lunch "${MK}-eng"; then
          LUNCH_OK="${MK}-eng"
        else
          for rel in bp2a bp1a ap4a ap3a ap2a ap1a trunk_staging $RELS; do
            if try_lunch "${MK}-${rel}-eng"; then
              LUNCH_OK="${MK}-${rel}-eng"
              break
            fi
          done
        fi

        if [ -z "$LUNCH_OK" ]; then
          echo "::error::lunch 目标探测失败，下面打印现场用于排查"
          echo "===== device/ 顶层 ====="; ls device/ || true
          echo "===== device/ 下三级目录里的 mk ====="; find device -maxdepth 4 -name "*.mk" 2>/dev/null | head -30 || true
          echo "===== 所有 AndroidProducts.mk ====="; find device -maxdepth 4 -name AndroidProducts.mk || true
          echo "===== 源码里的 release 配置目录 ====="; ls build/release/release_configs 2>/dev/null || echo "(不存在)"
          echo "===== 最后一次 lunch 尝试的完整输出 ====="; cat "$LUNCH_ERR" || true
          echo "===== 设备树 BoardConfig 分区/输出配置 ====="
          grep -nE "TARGET_COPY_OUT_|BOARD_[A-Z0-9_]+IMAGE_(FILE_SYSTEM_TYPE|PARTITION_SIZE)|BOARD_[A-Z0-9_]+_LIST" "${{ inputs.DEVICE_PATH }}/BoardConfig.mk" 2>/dev/null || true
          exit 1
        fi

        echo "使用 lunch 目标：$LUNCH_OK"
        lunch "$LUNCH_OK"
        PRODUCT=$(get_build_var TARGET_PRODUCT)
        echo "TARGET_PRODUCT=$PRODUCT"
        echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"

        # 产物目录以 get_build_var 为准，不要用 out/target/product/$TARGET_PRODUCT
        # 硬拼——TWRP 的 PRODUCT_OUT 有时带前缀，硬拼会指到一个不存在的目录
        PRODUCT_OUT_REAL=$(get_build_var PRODUCT_OUT 2>/dev/null || true)
        [ -z "$PRODUCT_OUT_REAL" ] && PRODUCT_OUT_REAL="out/target/product/${PRODUCT}"
        echo "PRODUCT_OUT=$PRODUCT_OUT_REAL"
        echo "product_out=$PRODUCT_OUT_REAL" >> "$GITHUB_OUTPUT"

        # 目标名必须和设备树真实拥有的分区对齐：
        #   设备树没开 BOARD_USES_VENDOR_BOOTIMAGE 时，vendorbootimage 在
        #   build/make 里是个「没有依赖也没有配方」的空目标，make 只会
        #   回一句 Nothing to be done 然后 exit 0 —— 表现就是「编译成功
        #   但没有生成任何 .img」。这里提前对齐，不要等打包阶段才发现。
        if [ "$MAKE_TARGET" = "vendorbootimage" ]; then
          VB=$(get_build_var BOARD_USES_VENDOR_BOOTIMAGE 2>/dev/null || true)
          echo "BOARD_USES_VENDOR_BOOTIMAGE=${VB:-<未定义>}"
          case "$VB" in
            true|TRUE|1) : ;;
            *)
              echo "::warning::设备树未开启 vendor_boot，vendorbootimage 是空目标 → 自动改用 bootimage（检查 BoardConfig 里是否是写成了 BOARD_USES_VENDOR_BOOT，正确名是 BOARD_USES_VENDOR_BOOTIMAGE）"
              MAKE_TARGET="bootimage"
              ;;
          esac
        fi
        echo "MAKE_TARGET=$MAKE_TARGET"

        # 并发按内存算：-j$(nproc) 在 16GB runner 上会把内存吃穿，
        # OOM 杀掉 runner agent 的表现就是 "lost communication with the server"
        CPUS=$(nproc --all)
        MEM_GB=$(awk '/MemTotal/{printf "%d", $2/1024/1024}' /proc/meminfo)
        JOBS="${{ inputs.BUILD_JOBS }}"
        case "$JOBS" in
          ''|*[!0-9]*) JOBS=0 ;;
        esac
        if [ "$JOBS" -eq 0 ]; then
          JOBS=$(( MEM_GB / 4 ))
          [ "$JOBS" -gt "$CPUS" ] && JOBS=$CPUS
          [ "$JOBS" -lt 2 ] && JOBS=2
        fi
        AVAIL_GB=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
        echo "CPU=${CPUS} 内存=${MEM_GB}GB 磁盘可用=${AVAIL_GB}GB"
        free -h || true
        df -h . || true
        if [ "$AVAIL_GB" -lt 15 ]; then
          echo "::warning::磁盘仅剩 ${AVAIL_GB}GB，out/ 可能写满导致 runner 失联"
        fi
        echo "并行度：make -j${JOBS}"

        # soong_build 是 Go 程序，给个软上限让它多做 GC，而不是被内核 OOM
        if [ -z "${GOMEMLIMIT:-}" ]; then
          export GOMEMLIMIT=$(( MEM_GB * 70 / 100 ))GiB
        fi
        export GOGC="${GOGC:-80}"
        echo "GOMEMLIMIT=$GOMEMLIMIT GOGC=$GOGC"
        echo "（这两个变量靠 scripts/patch_soong_memlimit.py 透传给 soong_build）"

        # 心跳：进程被外部杀掉时日志会突然截断，有这条时间线才能区分 OOM 和外部原因
        (
          while :; do
            sleep 60 || exit 0
            printf '[heartbeat %s] ' "$(date -u +%H:%M:%S)"
            awk '/MemAvailable/{printf "可用内存 %.1fGB ", $2/1024/1024}' /proc/meminfo
            printf '剩余磁盘 %sGB\n' "$(df -BG --output=avail . 2>/dev/null | tail -1 | tr -dc '0-9')"
          done
        ) &
        HB=$!
        stop_hb() { kill "$HB" 2>/dev/null || true; pkill -P "$HB" 2>/dev/null || true; }

        on_term() {
          stop_hb
          echo "::error::编译进程收到 SIGTERM（exit 143）——任务被取消、超时或 runner 被回收"
          echo "===== 内存 ====="; free -h || true
          echo "===== 磁盘 ====="; df -h . || true
          echo "===== 内存占用 top10 ====="
          ps -eo pid,rss,pcpu,comm --sort=-rss 2>/dev/null | head -10 || true
          echo "===== 内核 OOM 记录 ====="
          sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process|oom" | tail -10 || true
        }
        trap on_term TERM INT

        set -o pipefail
        RC=0
        make -j"$JOBS" "$MAKE_TARGET" 2>&1 | tee build.log || RC=${PIPESTATUS[0]}
        trap - TERM INT
        stop_hb

        # ────────────────────────────────────────────────────────────
        # 产物自检
        #   make 返回 0 但一个 .img 都没有的场景有两种：
        #   (a) 目标名和设备树对不上（比如设备只有 boot 分区却被要求
        #       vendorbootimage），kati 把它当成已满足的空目标；
        #   (b) 产物写到了 PRODUCT_OUT 之外的目录。
        #   两种情况都在这里当场发现并补编，不要让后面 Collect 才报
        #   "没有生成任何 .img" 这种没有信息量的错。
        # ────────────────────────────────────────────────────────────
        count_imgs() { ls -1 "$PRODUCT_OUT_REAL"/*.img 2>/dev/null | wc -l; }
        if [ "$RC" -eq 0 ] && [ "$(count_imgs)" -eq 0 ]; then
          echo "::warning::make 退出码 0，但 $PRODUCT_OUT_REAL 下没有任何 .img"
          echo "===== build.log 最后 30 行 ====="
          tail -30 build.log 2>/dev/null || true
          echo "===== 是否 Nothing to be done / 目标被忽略 ====="
          grep -nE "Nothing to be done|No rule to make target" build.log || echo "(无该提示)"
          echo "===== out/target/product 下的目录 ====="
          ls -1 out/target/product 2>/dev/null || echo "(空)"
          echo "===== 其它目录里是否已有镜像 ====="
          find out/target/product -maxdepth 2 -name "*.img" 2>/dev/null | head -20 || true
          # 逐级降级补编：已编译的对象都在，补编只是打包，很快
          for t in bootimage recoveryimage vendorbootimage; do
            [ "$t" = "$MAKE_TARGET" ] && continue
            echo "::group::补编目标 $t"
            make -j"$JOBS" "$t" 2>&1 | tee -a build.log || echo "::warning::$t 未编出结果"
            echo "::endgroup::"
            if [ "$(count_imgs)" -gt 0 ]; then
              echo "::notice::$t 产出了镜像"
              RC=0
              break
            fi
          done
          if [ "$(count_imgs)" -eq 0 ]; then
            echo "::group::补编目标 droid（全量打包）"
            make -j"$JOBS" droid 2>&1 | tee -a build.log || echo "::warning::droid 未编出结果"
            echo "::endgroup::"
          fi
          [ "$(count_imgs)" -gt 0 ] && RC=0
        fi

        show_failed() {
          awk -v max="${2:-3}" '
            /^FAILED: /{n++; if (n > max) exit; show = 1; c = 0}
            show {
              if (c > 0 && (/^\[ *[0-9]+%/ || /^ninja: /)) {show = 0; next}
              print; c++
              if (c >= 23) show = 0
            }' "$1"
        }
        if [ "$RC" -ne 0 ] && [ -f build.log ]; then
          echo "::group::编译失败摘要"
          show_failed build.log 3 || true
          echo "===== 缺失依赖（占位规则）====="
          grep -oE "^module [^ ]+ missing dependencies: .*" build.log | sort -u | head -10 || true
          echo "===== error 行 ====="
          grep -nE "(^| )error: " build.log | head -10 || true
          echo "::endgroup::"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## 构建失败（make 退出码 $RC）"
              echo '```'
              show_failed build.log 3 | head -60
              echo '```'
              echo "完整日志见 artifact：\`build-log-$GITHUB_RUN_ID\` 的 \`build-errors.txt\`"
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
        fi
        echo "make 退出码：$RC"
        ccache -s 2>/dev/null | head -12 || true
        exit "$RC"

    # ──────────────────────────────────────────────────────────────
    # 7. 失败取证
    # ──────────────────────────────────────────────────────────────
    - name: Diagnose unexpected termination
      if: failure() || cancelled()
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        echo "===== 内存 ====="; free -h || true
        echo "===== 磁盘 ====="; df -h . / || true
        echo "===== 内核 OOM / kill 记录 ====="
        sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || echo "(dmesg 取不到 OOM 记录)"
        echo "===== 内存占用 top10 ====="
        ps -eo pid,rss,pcpu,etime,comm --sort=-rss 2>/dev/null | head -11 || true
        echo "===== 编译日志尾部（最后 60 行）====="
        if [ -f build.log ]; then tail -60 build.log; else echo "(没有 build.log，说明还没进到 make 就被终止了)"; fi
        echo "===== 失败任务（FAILED 块，完整写入 build-errors.txt）====="
        if [ -f build.log ]; then
          show_failed() {
            awk -v max="${2:-5}" '
              /^FAILED: /{n++; if (n > max) exit; show = 1; c = 0}
              show {
                if (c > 0 && (/^\[ *[0-9]+%/ || /^ninja: /)) {show = 0; next}
                print; c++
                if (c >= 23) show = 0
              }' "$1"
          }
          : > build-errors.txt
          echo "===== FAILED 块（前 5 个）=====" | tee -a build-errors.txt
          show_failed build.log 5 | tee -a build-errors.txt || true
          echo "===== error 行 =====" | tee -a build-errors.txt
          grep -nE "(^| )error: " build.log | head -40 | tee -a build-errors.txt || true
          echo "===== 缺失依赖（占位规则）=====" | tee -a build-errors.txt
          grep -oE "^module [^ ]+ missing dependencies: .*" build.log | sort -u | head -20 | tee -a build-errors.txt || true
        fi
        echo "===== ninja 失败摘要 ====="
        if [ -f build.log ]; then
          grep -nE "^FAILED: |missing and no known rule|ninja failed with" build.log | tail -20 || true
          if grep -q "missing and no known rule" build.log; then
            echo "::notice::缺少构建规则：通常引用了源码里不存在的模块名"
            grep -oE "[A-Za-z0-9_.@+-]+-ndk_platform" build.log | sort -u | head -10 || true
          fi
        fi

    - name: Upload build log on failure
      if: failure() || cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: |
          workspace/build.log
          workspace/build-errors.txt
        if-no-files-found: ignore
        retention-days: 5

    # ──────────────────────────────────────────────────────────────
    # 8. 产物
    # ──────────────────────────────────────────────────────────────
    - name: Collect outputs
      id: collect
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -uo pipefail
        OUT="${{ steps.build.outputs.product_out }}"
        [ -z "$OUT" ] && OUT="out/target/product/${{ steps.build.outputs.product }}"

        echo "===== 期望产物目录：$OUT ====="
        if [ -d "$OUT" ]; then
          ls -lh "$OUT"/ 2>/dev/null | head -40 || true
          echo "----- .img / .zip -----"
          ls -lh "$OUT"/*.img "$OUT"/*.zip 2>/dev/null || echo "(该目录下没有 img/zip)"
        else
          echo "(目录不存在)"
        fi

        # 兜底：在整个 out/ 里找镜像，产物目录名有时和设备树对不上
        if ! ls "$OUT"/*.img >/dev/null 2>&1; then
          echo "===== 在 out/target/product 下全量搜索 .img ====="
          find out/target/product -maxdepth 2 -name "*.img" -size +1M 2>/dev/null | head -20 || true
          CAND=$(find out/target/product -maxdepth 2 -name "*.img" -size +1M -printf '%h\n' 2>/dev/null | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
          if [ -n "$CAND" ]; then
            echo "::notice::在 $CAND 找到镜像，改用它作为产物目录"
            OUT="$CAND"
          fi
        fi

        # 统一收口到 dist/，上传步骤只看这一个目录
        rm -rf dist && mkdir -p dist
        shopt -s nullglob
        imgs=("$OUT"/*.img) zips=("$OUT"/*.zip)
        for f in "${imgs[@]}" "${zips[@]}"; do cp -f "$f" dist/ 2>/dev/null || true; done
        shopt -u nullglob
        echo "dist=dist" >> "$GITHUB_OUTPUT"

        echo "===== 交付目录 dist/ ====="
        ls -lh dist/ 2>/dev/null || true
        if [ -z "$(ls -A dist 2>/dev/null)" ]; then
          echo "::error::没有生成任何 .img/.zip —— make 成功但没打包出镜像"
          echo "常见原因：BUILD_TARGET 与该设备树的分区不匹配（例：设备没有 vendor_boot 却要求 vendorbootimage），"
          echo "或 BoardConfig 未开启对应镜像（BOARD_USES_VENDOR_BOOTIMAGE / BOARD_USES_RECOVERY_AS_BOOT）。"
          echo "请把本次运行的 build.log 尾部贴出来。"
          exit 1
        fi

    - name: Upload artifacts (always)
      if: always() && steps.collect.outputs.dist != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          workspace/dist/*
        if-no-files-found: warn

    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/dist/*
        name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: false
        body: |
          Runner: ubuntu-22.04
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ inputs.DEVICE_NAME }}
          Target: ${{ inputs.BUILD_TARGET }}.img
          Java: ${{ inputs.JAVA_VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
